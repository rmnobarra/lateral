[project]
name = "lateral"
version = "0.1.0"
description = "Lateral — verificação proativa entre feature branches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lateral = "lateral.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lateral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
